default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: jozu_development

# Test data is disposable; never point this environment at a real user database.
test:
  <<: *default
  database: jozu_test

# Rails merges DATABASE_URL into this configuration. Solid Cache uses this same
# database and pool; no separate cache, queue, or cable services are needed.
production:
  <<: *default
  database: jozu_production
